name: Generate descriptions

on:
  workflow_dispatch:
  schedule:
    # hourly, to collect finished batch jobs and submit new ones
    - cron: "17 * * * *"

concurrency:
  group: generate-descriptions
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: Generate descriptions
        run: uv run python -m src.summarize.generate

      # commit what was saved even if the script failed later, but still fail the job
      - name: Count described instances
        if: ${{ !cancelled() }}
        id: count
        run: |
          count=$(git status --porcelain --untracked-files=all | grep -c '/output\.json$' || true)
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: ${{ !cancelled() }}
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Describe ${{ steps.count.outputs.count }} server instance(s)"
          file_pattern: "data/**"
